name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: $/.github/workflows/build.yml

  passed:
    name: Checks passed
    if: always()
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - if: needs.build.result != 'success'
        run: exit 1
