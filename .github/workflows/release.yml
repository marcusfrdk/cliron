name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-24.04
    outputs:
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag matches the version in Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml"
            exit 1
          fi
      - name: Check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi
      - name: Read the release notes from CHANGELOG.md
        id: changelog
        run: |
          notes=$(awk -v heading="## $GITHUB_REF_NAME" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && NF { started = 1 }
            started { print }
          ' CHANGELOG.md)
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no entries under ## $GITHUB_REF_NAME"
            exit 1
          fi
          delimiter=$(openssl rand -hex 16)
          {
            echo "notes<<$delimiter"
            echo "$notes"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    uses: $/.github/workflows/build.yml

  draft:
    name: Draft GitHub release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.verify.outputs.notes }}
        run: |
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --yes
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTES"

  pypi:
    name: Publish to PyPI
    needs: draft
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/cliron/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  publish:
    name: Publish GitHub release
    needs: pypi
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
