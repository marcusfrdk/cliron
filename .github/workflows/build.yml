name: Build

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv run --locked --only-group dev ruff format --check
      - run: uv run --locked --only-group dev ruff check --ignore-noqa
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --only-group dev zizmor .

  python:
    name: Python ${{ matrix.python }} checks
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python }}
      - run: uv run --locked basedpyright
      - name: Install zsh and fish for the completion tests
        run: sudo apt-get update && sudo apt-get install --yes zsh fish
      - run: uv run --locked coverage run -m pytest
      - run: uv run --locked coverage report

  dist:
    name: Distributions (${{ matrix.runner }})
    needs: [lint, python]
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv build
      - name: Test the distributions on the oldest and newest supported Python
        run: |
          for python in 3.11 3.15; do
            uv run --no-project --isolated --python "$python" --with pytest --with dist/*.whl pytest
            uv run --no-project --isolated --python "$python" --with pytest --with dist/*.tar.gz pytest
          done
      - if: matrix.runner == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
