[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "cliron"
version = "0.1.0"
description = "Everything you need to build your own CLI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["cli", "command-line", "framework"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/marcusfrdk/cliron"
Issues = "https://github.com/marcusfrdk/cliron/issues"
Changelog = "https://github.com/marcusfrdk/cliron/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "coverage>=7.17",
    "pytest>=9",
    "ruff>=0.17",
    "zizmor>=1.31",
]

[tool.uv]
required-version = ">=0.11"

[tool.uv.build-backend]
module-root = ""

[tool.pytest]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cliron"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"cliron/__init__.py" = ["PLC0415"]
"tests/**" = ["D1", "INP001", "S101"]
