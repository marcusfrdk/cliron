[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "cliron"
description = "Everything you need to build your own CLI, for humans and AI agents alike."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = ["cli", "command-line", "framework", "agents", "ai", "rust"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/marcusfrdk/cliron"
Issues = "https://github.com/marcusfrdk/cliron/issues"
Changelog = "https://github.com/marcusfrdk/cliron/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "basedpyright>=1.40",
    "coverage>=7.17",
    "maturin>=1.15,<2.0",
    "pytest>=9",
    "ruff>=0.17",
    "zizmor>=1.31",
]

[tool.maturin]
module-name = "cliron._core"
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.uv]
required-version = ">=0.11"
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "src/**/*.rs" },
]

[tool.pytest]
addopts = ["--import-mode=importlib"]
filterwarnings = ["error"]
strict = true
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["cliron"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY001", "D203", "D212"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1", "INP001", "S101"]
