[package]
name = "cliron"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Rust core of cliron, an AI-native, lightweight, customizable and dependency-free Python CLI framework."
license = "MIT"
readme = "README.md"
repository = "https://github.com/marcusfrdk/cliron"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
